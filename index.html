<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-5">
        <div class="card shadow-sm mx-auto todo-card">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">📝 To-Do List</h3>


                <div class="input-group mb-3">
                    <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task...">
                    <button class="btn btn-primary" id="addTaskBtn">Add</button>
                </div>


                <ul class="list-group" id="taskList"></ul>


                <div class="mt-3 d-flex gap- justify-content-between align-items-center">
                    <small id="taskCount" class="text-muted">0 tasks</small>
                    <button class="btn btn-outline-danger btn-sm" id="clearAllBtn">Clear All</button>

                </div>
            </div>
        </div>
    </div>


    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</body>

</html>
